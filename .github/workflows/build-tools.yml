# Builds XenonAnalyse and XenonRecomp for Windows x64 on GitHub's runners,
# so nothing needs to be installed locally. No game files are involved here:
# the tools are run on your own PC against your own disc.

name: Build Xenon tools

on:
  workflow_dispatch:
    inputs:
      xenonrecomp_ref:
        description: "XenonRecomp branch, tag or commit to build (patches in patches/ must apply to it)"
        default: "ddd128bcca99fe8bfbb99bea583c972351fa6ace"
        required: true
  push:
    paths:
      - ".github/workflows/build-tools.yml"
      - "patches/**"
      - "analysis/xexdump.cpp"

permissions:
  contents: write   # needed to publish the release with the zip

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out XenonRecomp
        uses: actions/checkout@v4
        with:
          repository: hedge-dev/XenonRecomp
          ref: ${{ github.event.inputs.xenonrecomp_ref || 'ddd128bcca99fe8bfbb99bea583c972351fa6ace' }}
          submodules: recursive
          path: XenonRecomp

      - name: Check out this repo (for patches)
        uses: actions/checkout@v4
        with:
          path: project

      - name: Apply NBA 2K18 patches to XenonRecomp
        shell: bash
        run: |
          shopt -s nullglob
          for p in project/patches/*.patch; do
            echo "Applying $p"
            git -C XenonRecomp apply --whitespace=nowarn "$GITHUB_WORKSPACE/$p"
          done

      - name: Set up MSVC environment (for clang-cl's linker and headers)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Add XexDump (writes the decrypted image the runtime loads)
        shell: bash
        run: |
          cat >> XenonRecomp/CMakeLists.txt <<'EOF'

          add_executable(XexDump "${CMAKE_CURRENT_SOURCE_DIR}/../project/analysis/xexdump.cpp")
          target_link_libraries(XexDump PRIVATE XenonUtils)
          EOF

      - name: Configure
        working-directory: XenonRecomp
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang-cl
          -DCMAKE_CXX_COMPILER=clang-cl
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build
        working-directory: XenonRecomp
        run: cmake --build build

      - name: Build xdvdfs (ISO extractor)
        run: cargo install xdvdfs-cli --root xdvdfs-bin --locked

      - name: Package
        shell: pwsh
        run: |
          $out = "xenon-tools"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item xdvdfs-bin/bin/xdvdfs.exe $out
          foreach ($name in "XenonAnalyse.exe","XenonRecomp.exe","XexDump.exe") {
            $f = Get-ChildItem XenonRecomp/build -Recurse -Filter $name | Select-Object -First 1
            if (-not $f) { throw "$name was not produced by the build" }
            Copy-Item $f.FullName $out
          }
          $ctx = Get-ChildItem XenonRecomp -Recurse -Filter "ppc_context.h" | Select-Object -First 1
          if (-not $ctx) { throw "ppc_context.h not found" }
          Copy-Item $ctx.FullName $out
          Copy-Item XenonRecomp/LICENSE* $out -ErrorAction SilentlyContinue
          # simde headers (MIT): needed to compile the recompiled code on the PC
          Copy-Item -Recurse XenonRecomp/thirdparty/simde "$out/simde"
          $commit = git -C XenonRecomp rev-parse HEAD
          "XenonRecomp commit: $commit`nBuilt: $(Get-Date -Format s)Z" | Set-Content "$out/BUILD-INFO.txt"
          Compress-Archive -Path "$out/*" -DestinationPath xenon-tools-win64.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: xenon-tools-win64
          path: xenon-tools-win64.zip

      - name: Publish as release "tools-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tools-latest
          name: Xenon tools (latest build)
          body: xdvdfs, XenonAnalyse, XenonRecomp, XexDump, ppc_context.h and simde headers built for Windows x64. See BUILD-INFO.txt inside the zip for the exact XenonRecomp commit.
          files: xenon-tools-win64.zip
          make_latest: true

  # Portable compiler toolchain for building the game on the PC without
  # Visual Studio: llvm-mingw (clang + Windows headers/libs), CMake, Ninja.
  # Mirrored into this repo's "toolchain" release with SHA-256 hashes so the
  # setup script downloads from one place and can verify what it gets.
  toolchain:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch latest official releases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dl && cd dl
          pick() {  # repo, asset-name regex, output name
            url=$(gh api "repos/$1/releases/latest" --jq ".assets[] | select(.name | test(\"$2\")) | .browser_download_url" | head -1)
            tag=$(gh api "repos/$1/releases/latest" --jq .tag_name)
            [ -n "$url" ] || { echo "no asset matching $2 in $1"; exit 1; }
            echo "$1 $tag $url"
            curl -fsSL -o "$3" "$url"
            echo "$3 $1 $tag $(basename "$url")" >> ../SOURCES.txt
          }
          pick mstorsjo/llvm-mingw '^llvm-mingw-[0-9]+-ucrt-x86_64\.zip$' llvm-mingw.zip
          pick Kitware/CMake       '^cmake-[0-9.]+-windows-x86_64\.zip$'   cmake.zip
          pick ninja-build/ninja   '^ninja-win\.zip$'                      ninja.zip
          sha256sum *.zip > SHA256SUMS
          cat SHA256SUMS ../SOURCES.txt
          cp ../SOURCES.txt .

      - name: Publish as release "toolchain"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: toolchain
          name: Portable build toolchain
          body: Unmodified copies of the latest llvm-mingw (ucrt, x86_64), CMake and Ninja Windows releases. SHA256SUMS lists their hashes; SOURCES.txt says where each came from.
          files: |
            dl/llvm-mingw.zip
            dl/cmake.zip
            dl/ninja.zip
            dl/SHA256SUMS
            dl/SOURCES.txt
          make_latest: false
